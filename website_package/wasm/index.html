<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RNA Workbench</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #d8dde6;
      --text: #172033;
      --muted: #5f6b7a;
      --accent: #0f766e;
      --accent-2: #1d4ed8;
      --danger: #b91c1c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
    }
    header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-columns: minmax(330px, 430px) minmax(620px, 1fr);
      min-height: calc(100vh - 52px);
    }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfd;
      padding: 16px;
      overflow: auto;
    }
    section.workspace {
      padding: 16px;
      overflow: auto;
      min-width: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 650;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 5px;
      font-weight: 600;
    }
    textarea, input, select {
      width: 100%;
      border: 1px solid #c9d1dc;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: 13px var(--mono);
      padding: 8px 9px;
      outline: none;
    }
    textarea:focus, input:focus, select:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.12);
    }
    textarea { resize: vertical; min-height: 74px; }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row > * { flex: 1; }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .button-grid .primary-action {
      grid-column: 1 / -1;
    }
    .checkbox-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .checkbox-row input {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }
    button {
      border: 1px solid #0f5f59;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      font-weight: 650;
      padding: 9px 12px;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: #c9d1dc;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }
    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }
    .status.error { color: var(--danger); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(96px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .metric {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 62px;
    }
    .metric .value {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .metric .label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
      gap: 14px;
      align-items: start;
    }
    .table-pane {
      min-width: 0;
      overflow-x: auto;
    }
    table {
      width: 100%;
      min-width: 840px;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid #e8ebf0;
      padding: 7px 8px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    th {
      background: #f0f3f7;
      color: #3a4656;
      font-size: 12px;
      font-weight: 650;
    }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    tr:hover td { background: #f7fafc; }
    tr.selected td { background: #eaf6f4; }
    td.sequence {
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--mono);
      text-align: left;
    }
    .viewer {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }
    .viewer h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .svg-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .svg-box {
      border: 1px solid #e2e7ef;
      border-radius: 6px;
      min-height: 190px;
      overflow: auto;
      background: #fff;
      padding: 8px;
    }
    .svg-box .caption {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 650;
    }
    .svg-box svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .svg-placeholder {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      background: #f7f8fa;
      border-radius: 6px;
    }
    .details {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: #263449;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f7f8fa;
      border: 1px solid #e2e7ef;
      border-radius: 6px;
      padding: 8px;
      max-height: 160px;
      overflow: auto;
    }
    .ensemble {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .ensemble .svg-box {
      height: 220px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ensemble .svg-scale {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .ensemble .svg-scale svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      margin: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #e8edf5;
      color: #3d4a5d;
      font-size: 12px;
      font-weight: 600;
    }
    @media (max-width: 1050px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--line); }
      .split { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <h1>RNA Workbench</h1>
    <span class="badge" id="deviceBadge">loading</span>
  </header>
  <main>
    <aside>
      <div class="panel">
        <h2>Constraints</h2>
        <label for="structure">Structure</label>
        <textarea id="structure" spellcheck="false">..((((((((..((((((((((((...))))))(((.........)))((((((...))))))))))))..((((((((...)))))))))))))))).</textarea>
        <label for="baseMask">Sequence / Base Mask</label>
        <textarea id="baseMask" spellcheck="false">???????????????????????????????????????????????????????????????????????????????????????????????????</textarea>
      </div>
      <div class="panel">
        <h2>Sampling</h2>
        <div class="grid2">
          <div>
            <label for="sampleN">N</label>
            <input id="sampleN" type="number" min="1" max="512" value="32" />
          </div>
          <div>
            <label for="temperature">Temperature</label>
            <input id="temperature" type="number" min="0" step="0.05" value="0.1" />
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="seed">Seed</label>
            <input id="seed" type="number" value="20260509" />
          </div>
          <div>
            <label for="batchSize">Batch</label>
            <input id="batchSize" type="number" min="1" max="512" value="128" />
          </div>
        </div>
        <label class="checkbox-row">
          <input id="uniqueOnly" type="checkbox" checked />
          <span>Unique rows</span>
        </label>
        <div class="button-grid">
          <button class="primary-action" id="designBtn">Design</button>
          <button class="secondary" id="exampleBtn">Example</button>
          <button class="secondary" id="removeSequenceBtn">Remove Seq</button>
          <button class="secondary" id="maskSequenceBtn">Mask Seq</button>
          <button class="secondary" id="maskStructureBtn">Mask Struct</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </aside>
    <section class="workspace">
      <div class="metrics" id="metrics"></div>
      <div class="split">
        <div class="table-pane">
          <table>
            <thead>
              <tr>
                <th>rank</th>
                <th>sequence</th>
                <th>p</th>
                <th>log p/nt</th>
                <th>MFE</th>
                <th>uMFE</th>
                <th>struct err</th>
                <th>cond err</th>
                <th>GC</th>
              </tr>
            </thead>
            <tbody id="candidateRows"></tbody>
          </table>
        </div>
        <div class="viewer">
          <h2>Viewer</h2>
          <div class="svg-grid">
            <div class="svg-box">
              <div class="caption">Target</div>
              <div id="targetSvg"></div>
            </div>
            <div class="svg-box">
              <div class="caption">Selected MFE</div>
              <div id="mfeSvg"></div>
            </div>
          </div>
          <div class="row" style="margin-top:10px">
            <button class="secondary" id="ensembleBtn" disabled>Sample Ensemble</button>
            <input id="ensembleN" type="number" min="1" max="256" value="24" />
          </div>
          <div class="details" id="details"></div>
          <div class="ensemble" id="ensemble"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script>
    let latest = null;
    let selected = null;
    let exampleTruth = null;
    let statusTimer = null;
    let renderToken = 0;
    const API_BASE = String(window.RNA_WORKBENCH_API_BASE || "").replace(/\/+$/, "");

    const $ = (id) => document.getElementById(id);
    const fmt = (x, d = 3) => x === null || x === undefined || Number.isNaN(Number(x)) ? "" : Number(x).toFixed(d);
    const boolMark = (x) => x ? "yes" : "";

    function setStatus(text, isError = false) {
      $("status").textContent = text || "";
      $("status").className = isError ? "status error" : "status";
    }

    function metric(label, value) {
      return `<div class="metric"><div class="value">${value}</div><div class="label">${label}</div></div>`;
    }

    function compact(text) {
      return String(text || "").replace(/\s+/g, "");
    }

    function isConcreteSequence(text) {
      const sequence = compact(text).toUpperCase().replaceAll("T", "U");
      return sequence.length > 0 && /^[ACGU]+$/.test(sequence);
    }

    function isConcreteStructure(text) {
      const structure = compact(text);
      return structure.length > 0 && !/[?#]/.test(structure);
    }

    function readConcreteSequence() {
      return isConcreteSequence($("baseMask").value)
        ? compact($("baseMask").value).toUpperCase().replaceAll("T", "U")
        : "";
    }

    function readConcreteStructure() {
      return isConcreteStructure($("structure").value) ? compact($("structure").value) : "";
    }

    function updateWitnessFromInputs() {
      const sequence = readConcreteSequence();
      const structure = readConcreteStructure();
      if (sequence && structure && sequence.length === structure.length) {
        exampleTruth = {sequence, structure};
      }
    }

    function sourceForMask() {
      const sequence = readConcreteSequence() || (exampleTruth ? exampleTruth.sequence : "");
      const structure = readConcreteStructure() || (exampleTruth ? exampleTruth.structure : "");
      if (!sequence) throw new Error("No concrete sequence is available to mask");
      if (!structure) throw new Error("No concrete structure is available to mask");
      return {sequence, structure};
    }

    function parseSvgLength(value) {
      const match = String(value || "").match(/^\s*([0-9.]+)/);
      return match ? Number(match[1]) : null;
    }

    function fitSvgs(root) {
      root.querySelectorAll("svg").forEach((svg) => {
        const width = parseSvgLength(svg.getAttribute("width"));
        const height = parseSvgLength(svg.getAttribute("height"));
        if (!svg.getAttribute("viewBox") && width && height) {
          svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        }
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      });
    }

    function setSvgHtml(id, html) {
      const root = $(id);
      root.innerHTML = html || "";
      fitSvgs(root);
    }

    function svgScale(html) {
      return `<div class="svg-scale">${html || ""}</div>`;
    }

    function svgPlaceholder(text) {
      return `<div class="svg-placeholder">${text}</div>`;
    }

    async function fetchJson(url, options = {}, timeoutMs = 30000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(`${API_BASE}${url}`, {...options, signal: controller.signal});
        const text = await response.text();
        const data = text ? JSON.parse(text) : {};
        if (!response.ok) throw new Error(data.error || `${response.status} ${response.statusText}`);
        return data;
      } catch (err) {
        if (err.name === "AbortError") {
          throw new Error(`Request timed out after ${Math.round(timeoutMs / 1000)}s`);
        }
        throw err;
      } finally {
        clearTimeout(timer);
      }
    }

    function padConstraintInputs() {
      const structure = compact($("structure").value);
      const baseMask = compact($("baseMask").value);
      const length = Math.max(structure.length, baseMask.length);
      if (!length) return {structure, baseMask};
      const paddedStructure = structure + "?".repeat(Math.max(0, length - structure.length));
      const paddedBaseMask = baseMask + "?".repeat(Math.max(0, length - baseMask.length));
      if (paddedStructure !== $("structure").value) $("structure").value = paddedStructure;
      if (paddedBaseMask !== $("baseMask").value) $("baseMask").value = paddedBaseMask;
      return {structure: paddedStructure, baseMask: paddedBaseMask};
    }

    function currentConstraintLength() {
      const length = Math.max(compact($("structure").value).length, compact($("baseMask").value).length);
      return Math.max(1, Math.min(500, length || 80));
    }

    function removeSequence() {
      updateWitnessFromInputs();
      const length = currentConstraintLength();
      $("baseMask").value = "?".repeat(length);
      setStatus(`Removed sequence; base mask length ${length}`);
    }

    function renderMetrics(result) {
      if (!result) {
        $("metrics").innerHTML = "";
        return;
      }
      const s = result.summary;
      $("metrics").innerHTML = [
        metric("length", s.length),
        metric("pairs", s.target_pair_count),
        metric("unique", s.unique_count),
        metric("best p", fmt(s.best_probability, 4)),
        metric("cond err", fmt(s.best_condition_error ?? s.best_pair_error, 4)),
        metric("seconds", fmt(s.seconds, 1)),
      ].join("");
    }

    function rowHtml(row) {
      return `<tr data-rank="${row.rank}">
        <td>${row.rank}</td>
        <td class="sequence" title="${row.sequence}">${row.sequence}</td>
        <td>${fmt(row.target_probability, 4)}</td>
        <td>${fmt(row.log_target_probability_per_nt, 4)}</td>
        <td>${boolMark(row.target_is_mfe)}</td>
        <td>${boolMark(row.target_is_umfe)}</td>
        <td>${fmt(row.mfe_condition_error ?? row.mfe_pair_error, 4)}</td>
        <td>${fmt(row.condition_error, 4)}</td>
        <td>${fmt(row.gc_fraction, 3)}</td>
      </tr>`;
    }

    function renderCandidates(result) {
      const body = $("candidateRows");
      body.innerHTML = result ? result.candidates.map(rowHtml).join("") : "";
      [...body.querySelectorAll("tr")].forEach((tr) => {
        tr.addEventListener("click", () => {
          const rank = Number(tr.dataset.rank);
          const row = latest.candidates.find((item) => item.rank === rank);
          selectCandidate(row);
        });
      });
      if (result && result.candidates.length) selectCandidate(result.candidates[0]);
    }

    async function renderSelectedSvg(row) {
      const token = ++renderToken;
      if (row.rank === 1) {
        setSvgHtml("mfeSvg", latest.best_mfe_svg || "");
        return;
      }
      $("mfeSvg").innerHTML = svgPlaceholder("Rendering selected MFE");
      const data = await fetchJson("/api/render", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          sequence: row.sequence,
          structure: row.mfe_dot,
          target_structure: latest.request.structure,
          base_mask: latest.request.base_mask,
        })
      }, 20000);
      if (token !== renderToken || selected !== row) return;
      if (data.svg) {
        setSvgHtml("mfeSvg", data.svg);
      }
    }

    function selectCandidate(row) {
      selected = row;
      [...$("candidateRows").querySelectorAll("tr")].forEach((tr) => {
        tr.classList.toggle("selected", Number(tr.dataset.rank) === row.rank);
      });
      $("ensembleBtn").disabled = false;
      $("ensemble").innerHTML = "";
      $("details").textContent = [
        `rank: ${row.rank}`,
        `sequence: ${row.sequence}`,
        `mfe: ${row.mfe_dot}`,
        `p: ${row.target_probability}`,
        `log p: ${row.log_target_probability}`,
        `structure error: ${row.mfe_condition_error ?? row.mfe_pair_error}`,
        `condition error: ${row.condition_error}`,
        `mfe energy: ${row.mfe_energy}`,
        `target energy: ${row.target_energy}`,
      ].join("\n");
      renderSelectedSvg(row).catch((err) => setStatus(err.message, true));
    }

    async function loadStatus() {
      try {
        const data = await fetchJson("/api/status", {}, 5000);
        $("deviceBadge").textContent = data.active_design ? `${data.device} · design running` : data.device;
      } catch (err) {
        $("deviceBadge").textContent = "offline";
        throw err;
      }
    }

    async function design() {
      $("designBtn").disabled = true;
      const start = performance.now();
      setStatus("Design running");
      statusTimer = setInterval(() => {
        setStatus(`Design running ${(performance.now() - start) / 1000 | 0}s`);
      }, 1000);
      try {
        const padded = padConstraintInputs();
        const payload = {
          structure: padded.structure,
          base_mask: padded.baseMask,
          checkpoint: "auto",
          custom_checkpoint: "",
          n: Number($("sampleN").value),
          temperature: Number($("temperature").value),
          seed: Number($("seed").value),
          batch_size: Number($("batchSize").value),
          unique_only: $("uniqueOnly").checked,
        };
        const data = await fetchJson("/api/design", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload),
        }, 90000);
        latest = data;
        setSvgHtml("targetSvg", data.target_svg);
        setSvgHtml("mfeSvg", data.best_mfe_svg);
        renderMetrics(data);
        renderCandidates(data);
        setStatus(`Saved ${data.saved_json}; model ${data.request.checkpoint}`);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        clearInterval(statusTimer);
        $("designBtn").disabled = false;
        loadStatus().catch(() => {});
      }
    }

    async function sampleEnsemble() {
      if (!selected) return;
      $("ensembleBtn").disabled = true;
      setStatus("Sampling ensemble");
      try {
        const data = await fetchJson("/api/sample_structures", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            sequence: selected.sequence,
            target_structure: latest.request.structure,
            base_mask: latest.request.base_mask,
            count: Number($("ensembleN").value),
          }),
        }, 30000);
        $("ensemble").innerHTML = data.structures.map((item) => `
            <div class="svg-box">
              <div class="caption">#${item.rank} count ${item.count}${item.pair_error !== null ? ` struct err ${fmt(item.pair_error, 4)}` : ""}</div>
              ${svgScale(item.svg)}
            </div>
        `).join("");
        fitSvgs($("ensemble"));
        setStatus(`Ensemble seed ${data.seed}; structures ${data.structures.length}`);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        $("ensembleBtn").disabled = false;
      }
    }

    async function fillExample() {
      $("exampleBtn").disabled = true;
      setStatus("Generating example");
      try {
        const data = await fetchJson("/api/random_example", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            length: currentConstraintLength(),
          }),
        }, 10000);
        exampleTruth = data;
        $("structure").value = data.structure;
        $("baseMask").value = data.base_mask;
        $("sampleN").value = "32";
        $("temperature").value = "0.1";
        setStatus(`Example seed ${data.seed}; MFE ${data.mfe_energy.toFixed(2)} kcal/mol`);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        $("exampleBtn").disabled = false;
      }
    }

    async function maskExample(maskSequence, maskStructure) {
      $("maskSequenceBtn").disabled = true;
      $("maskStructureBtn").disabled = true;
      setStatus(maskSequence ? "Masking sequence" : "Masking structure");
      try {
        updateWitnessFromInputs();
        const source = sourceForMask();
        const data = await fetchJson("/api/mask_constraints", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            sequence: source.sequence,
            structure: source.structure,
            mask_sequence: maskSequence,
            mask_structure: maskStructure,
          }),
        }, 10000);
        exampleTruth = source;
        if (maskStructure) $("structure").value = data.structure;
        if (maskSequence) $("baseMask").value = data.base_mask;
        const maskedText = maskSequence
          ? `${data.hidden_base_count} sequence tokens`
          : `${data.hidden_structure_count} structure tokens`;
        setStatus(`Mask seed ${data.seed}; masked ${maskedText}`);
      } catch (err) {
        setStatus(err.message, true);
      } finally {
        $("maskSequenceBtn").disabled = false;
        $("maskStructureBtn").disabled = false;
      }
    }

    $("designBtn").addEventListener("click", design);
    $("ensembleBtn").addEventListener("click", sampleEnsemble);
    $("exampleBtn").addEventListener("click", fillExample);
    $("removeSequenceBtn").addEventListener("click", removeSequence);
    $("maskSequenceBtn").addEventListener("click", () => maskExample(true, false));
    $("maskStructureBtn").addEventListener("click", () => maskExample(false, true));
    $("structure").addEventListener("input", updateWitnessFromInputs);
    $("baseMask").addEventListener("input", updateWitnessFromInputs);
    updateWitnessFromInputs();
    loadStatus().catch((err) => setStatus(err.message, true));
    setInterval(() => loadStatus().catch(() => {}), 5000);
  </script>
</body>
</html>
